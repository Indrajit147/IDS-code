[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ids"
version = "0.0.1"
description = "LLM-assisted drift-adaptive incremental federated IDS for IoT/IoMT (CICIoMT2024)"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Indrajit Gupta" }]
requires-python = ">=3.10"
# Lower bounds only: Kaggle ships its own pinned stack, and forcing reinstalls
# there breaks the image. Exact versions are captured per run in environment.json.
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=14",
    "scikit-learn>=1.3",
    "scipy>=1.11",
    "xgboost>=2.0",
    "lightgbm>=4.0",
    "shap>=0.44",
    "matplotlib>=3.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
nn = ["torch>=2.1"]                                  # M8 FedAvg/FedProx MLP
llm = ["transformers>=4.44", "accelerate>=0.33", "bitsandbytes>=0.43"]  # M11-M12 (Kaggle GPU)
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
