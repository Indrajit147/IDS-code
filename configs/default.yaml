# Default experiment configuration. Environment profiles (configs/env/*.yaml)
# override only paths/resources; experiment configs (configs/experiments/*.yaml)
# override method settings. Later milestones fill in their sections.

project: ids-ciciomt2024
seed: 42

paths:
  data_root: data                  # resolved relative to repo root unless absolute
  raw_csv: raw/ciciomt2024_full_8p7m.csv
  zenodo_dir: external/zenodo_19452870/extracted
  processed: processed
  splits: splits
  results_root: results/runs

resources:
  n_jobs: -1
  dev_sample_frac: 0.05            # stratified dev subsample ...
  dev_sample_floor: 20000          # ... classes with <= floor rows kept whole, others >= floor
  use_dev_sample: true

features:                          # D6 (see README / reports/m1/EDA.md shortcut check)
  exclude_wifi: [IAT]              # alone gives 0.83 6-class macro-F1 -> likely capture artifact
  exclude_ble: [cumulative_packet_count]  # per-capture packet counter (timestamp is never a feature)

labels:
  headline_target: y_category      # D1: 6-class headline
  targets: [y_binary, y_category, y_attack19]

timeline:                          # M2 (headline regime D4)
  windows: [t0, t1, t2, t3, t4, t5]
  headline: category_intro
  build: [category_intro, alt_order]   # timelines materialized by m2_build_partitions.py
  test_frac: 0.2                   # per (window, class): held-out client-local test share
  dedup: true                      # drop exact duplicate feature rows (keep first) before splitting
  # Window in which each attack19 class is INTRODUCED (glob patterns). A class
  # then recurs with fresh rows in every later window (cumulative stream).
  definitions:
    category_intro:                # proposal table; t5 = variant drift + population drift
      t0: ["Benign", "DoS-*"]
      t1: ["DDoS-*"]
      t2: ["Recon-Port-Scan", "Recon-Ping-Sweep"]
      t3: ["MQTT-*"]
      t4: ["ARP-Spoofing"]         # + BLE-DoS in the BLE sub-federation
      t5: ["Recon-OS-Scan", "Recon-VulScan"]
    alt_order:                     # sensitivity: different family order, t5 population drift only
      t0: ["Benign", "DDoS-*"]
      t1: ["MQTT-*"]
      t2: ["DoS-*"]
      t3: ["ARP-Spoofing"]
      t4: ["Recon-*"]
      t5: []

federation:                        # M2/M7
  n_clients: 15
  dirichlet_alpha: 0.5             # label skew; smaller = more non-IID
  population_drift:
    window: t5
    frac_clients: 0.33             # clients whose attack mix is re-drawn at this window
    held_back_device_frac: 0.25    # device groups withheld until this window (onboarding)

profiling:                         # Zenodo benign device captures (real device identities)
  use: true
  background: ["Active", "ActiveBroker", "Idle"]   # network-wide: spread over all clients

dpub:                              # D2: public calibration set for DA-FedDistill (inputs only)
  benign: 5000
  per_category: 3000               # split over the category's classes by size
  min_per_class: 50
  max_class_frac: 0.05             # never take more than 5% of a class
  window_mode: cumulative          # at window t use only classes introduced <= t

ble:                               # separate sub-federation (different feature space)
  n_clients: 3
  start_window: t4
  dev_frac: 0.05                   # BLE subsample for the dev pool

models:                            # M3 edge ensemble (edge-friendly limits)
  val_frac: 0.10                   # held out from training for early stopping / fusion / temperature
  weight_cap: 50.0                 # cap on balanced class weights
  early_stopping: 20
  xgb:
    n_estimators: 300
    max_depth: 8
    learning_rate: 0.1
    subsample: 0.8
    colsample_bytree: 0.8
    max_bin: 256
  lgb:
    n_estimators: 300
    num_leaves: 63
    max_depth: 10
    learning_rate: 0.1
    subsample: 0.8
    subsample_freq: 1
    colsample_bytree: 0.8
    min_child_samples: 20

gate:                              # M5
  tau_conf: 0.80
  tau_disagree: 0.20

llm:                               # M11
  backend: none                    # none | hf_local | llama_cpp | api
  model_id: google/gemma-2-2b-it
  quantization: 4bit
